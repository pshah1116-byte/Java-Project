<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Billing Management System</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232b4f7a'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EB%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <span class="brand-mark">B</span>
            <div>
                <div class="brand-name">BillDesk</div>
                <div class="brand-sub">Billing Management</div>
            </div>
        </div>
        <nav class="nav">
            <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
            <a href="#/customers" data-nav="customers">Customers</a>
            <a href="#/invoices" data-nav="invoices">Invoices</a>
            <a href="#/payments" data-nav="payments">Payments</a>
        </nav>
        <div class="sidebar-foot" id="dbStatus">
            <span class="dot"></span><span class="dot-label">Checking database…</span>
        </div>
    </aside>

    <div class="main">
        <header class="topbar">
            <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
            <h1 id="pageTitle">Dashboard</h1>
            <div class="topbar-actions" id="topbarActions"></div>
        </header>

        <div class="db-banner hidden" id="dbBanner">
            Cannot connect to MongoDB. Start the MongoDB server on your computer, then restart the application in IntelliJ IDEA.
        </div>

        <main class="content" id="app" aria-live="polite"></main>
    </div>
</div>

<!-- Form modal -->
<div class="overlay hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
        <div class="modal-head">
            <h2 id="modalTitle">Form</h2>
            <button class="icon-btn" data-close-modal aria-label="Close">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<!-- Confirmation dialog -->
<div class="overlay hidden" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal modal-small">
        <div class="modal-head">
            <h2 id="confirmTitle">Please confirm</h2>
        </div>
        <div class="modal-body">
            <p id="confirmMessage"></p>
            <div class="form-actions">
                <button class="btn btn-ghost" id="confirmCancel">Cancel</button>
                <button class="btn btn-danger" id="confirmOk">Delete</button>
            </div>
        </div>
    </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
