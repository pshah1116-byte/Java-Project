spring.application.name=billing-management-system

# Port 8081 so this app can run at the same time as the Client Management System (8080).
server.port=8081

# ------------------------------------------------------------------
# MongoDB
# MongoDB is a SEPARATE program and must already be running before
# you click Run in IntelliJ IDEA. To use another server, set the
# MONGODB_URI environment variable in Run > Edit Configurations.
# ------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/billing_management}

# Indexes (unique customer email, unique invoice number) are created by
# config/MongoStartupCheck right after startup.
spring.data.mongodb.auto-index-creation=false

# ------------------------------------------------------------------
# Billing defaults
# ------------------------------------------------------------------
# Nepal VAT. Used when an invoice does not specify its own tax rate.
billing.default-tax-rate=13.00
# Invoice numbers look like INV-2026-0001 (prefix, year, sequence).
billing.invoice-prefix=INV
# Days until the due date when an invoice is created without one.
billing.default-payment-terms-days=15

server.error.include-stacktrace=never
server.error.include-message=never
logging.level.org.mongodb.driver=WARN
